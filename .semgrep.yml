rules:
  - id: node-unsafe-eval
    patterns:
      - pattern-either:
          - pattern: 'eval(...)'
          - pattern: 'new Function(...)'
          - pattern: 'vm.runInContext(...)'
          - pattern: 'vm.runInNewContext(...)'
          - pattern: 'vm.runInThisContext(...)'
    message: "Avoid using unsafe eval() or dynamic Function compilation. This can lead to Remote Code Execution (RCE)."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: "A03:2021 - Injection"

  - id: node-command-injection
    patterns:
      - pattern-either:
          - pattern: "require('child_process').exec($CMD, ...)"
          - pattern: "require('child_process').execSync($CMD, ...)"
          - pattern: "child_process.exec($CMD, ...)"
          - pattern: "child_process.execSync($CMD, ...)"
      - pattern-not: 'child_process.exec("...", ...)'
      - pattern-not: 'child_process.execSync("...", ...)'
    message: "Executing commands constructed with dynamic parameters can lead to Command Injection."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021 - Injection"

  - id: nosql-injection-mongo
    patterns:
      - pattern-either:
          - pattern: '$MODEL.find({ $KEY: req.$REQ_PROP })'
          - pattern: '$MODEL.findOne({ $KEY: req.$REQ_PROP })'
          - pattern: '$MODEL.deleteMany({ $KEY: req.$REQ_PROP })'
          - pattern: '$MODEL.where(req.$REQ_PROP)'
    message: "Passing unsanitized request data directly into MongoDB query objects can lead to NoSQL Injection."
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp: "A03:2021 - Injection"

  - id: insecure-express-cors-wildcard
    patterns:
      - pattern: "cors({ origin: '*' })"
    message: "Configuring CORS with a wildcard ('*') origin in Express applications may allow unauthorized cross-origin access."
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-942: Permissive Cross-Domain Policy with Untrusted Domains"
      owasp: "A01:2021 - Broken Access Control"

  - id: weak-crypto-hashing
    patterns:
      - pattern-either:
          - pattern: "crypto.createHash('md5')"
          - pattern: "crypto.createHash('sha1')"
    message: "MD5 and SHA1 are cryptographically broken and weak hashing algorithms. Use SHA-256, SHA-512, or bcrypt/argon2 instead."
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"

  - id: hardcoded-jwt-secret
    patterns:
      - pattern: 'jwt.sign($PAYLOAD, "...", ...)'
    message: "Hardcoding JWT secret keys in source code is unsafe. Store JWT secrets securely in environment variables or secret managers."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"

  - id: react-dangerously-set-inner-html
    patterns:
      - pattern: '<$EL dangerouslySetInnerHTML={{ __html: $VAR }} ... />'
    message: "Using dangerouslySetInnerHTML in React without proper sanitization can introduce Cross-Site Scripting (XSS) vulnerabilities."
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"

  - id: path-traversal-fs-read
    patterns:
      - pattern-either:
          - pattern: 'fs.readFile(req.$REQ_PROP, ...)'
          - pattern: 'fs.readFileSync(req.$REQ_PROP, ...)'
          - pattern: 'fs.writeFile(req.$REQ_PROP, ...)'
          - pattern: 'fs.writeFileSync(req.$REQ_PROP, ...)'
    message: "Passing unsanitized user input into file system APIs can allow Path Traversal attacks."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: "A01:2021 - Broken Access Control"
